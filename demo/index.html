<!DOCTYPE html>
<html lang="en">
<head>

  <title>Mermaid Extras - demo</title>

  <!-- The library's own stylesheet, then the demo's. Only the first is something you'd take into your own project. -->
  <link rel="stylesheet" href="../lib/mermaid-extras.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="Mermaid Extras: dashboard">

      </a>
      <nav class="side-nav" aria-label="Main">
        <a href="#/" data-nav="dashboard" class="active">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>

        <a href="#/docs" data-nav="docs">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>

        <p class="side-note"><strong>Your charts stay in this browser.</strong> They are saved in local storage, so they are private to you and can't be shared.</p>
        <p class="side-version" id="app-version">Mermaid Extras</p>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1">
      <p class="muted loading">Loading...</p>
      <noscript><p>This demo needs JavaScript.</p></noscript>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>

</html>
